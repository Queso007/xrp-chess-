<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess xApp — Play vs Computer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<style>
  :root { --bg:#0f1420; --card:#1a2233; --accent:#f5b301; --text:#e8ecf4; --muted:#8b93a7; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; margin:0; padding:24px; }
  .wrap { max-width:520px; margin:0 auto; }
  header { text-align:center; margin-bottom:20px; }
  header h1 { margin:0 0 6px; }
  header h1 .xrp { color:var(--accent); }
  header p { color:var(--muted); margin:0; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:18px; }
  .card h2 { margin:0 0 12px; font-size:1.1rem; }
  button { background:var(--accent); color:#111; border:0; border-radius:8px; padding:12px 18px; font-size:1rem; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  select { background:#0c111c; color:var(--text); border:1px solid #2c3650; border-radius:8px; padding:12px; font-size:1rem; width:100%; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .controls label { color:var(--muted); font-size:.85rem; display:block; margin-bottom:4px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row button { flex:1; }
  #board { width:100%; max-width:480px; margin:0 auto 12px; }
  #board .square-55d63 { position:relative; }
  #board .square-55d63.selected-square { box-shadow:inset 0 0 0 3px var(--accent); }
  #board .move-dot { position:absolute; left:50%; top:50%; width:28%; height:28%; margin:-14% 0 0 -14%; border-radius:50%; background:rgba(20,20,20,.35); pointer-events:none; }
  #status { text-align:center; font-weight:700; min-height:1.4em; }
  #status.thinking { color:var(--accent); }
  #moves { color:var(--muted); font-size:.9rem; line-height:1.6; word-break:break-word; min-height:1.6em; }
  .muted { color:var(--muted); font-size:.9rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>♞ vs <span class="xrp">Computer</span></h1>
    <p>Free, no sign-in, no XRP. Just you against the engine.</p>
  </header>

  <div class="card">
    <div class="controls">
      <div>
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div>
        <label for="color">Play as</label>
        <select id="color">
          <option value="white" selected>White</option>
          <option value="black">Black</option>
          <option value="random">Random</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button id="newBtn">New game</button>
      <button id="flipBtn" class="ghost">Flip board</button>
      <button id="resignBtn" class="ghost">Resign</button>
    </div>
  </div>

  <div class="card">
    <div id="board"></div>
    <div id="status">Loading engine…</div>
    <div id="moves"></div>
    <div id="engineNote" class="muted"></div>
    <p class="muted">Tap a piece, then tap where it goes. Promotion auto-queens. <a href="/">← Back to lobby</a></p>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const DIFFS = {
  easy:   { skill: 2,  depth: 6 },
  medium: { skill: 10, depth: 10 },
  hard:   { skill: 20, depth: 14 }
};

let game = new Chess();
let board = null;
let engine = null;
let engineReady = false;
let engineMode = 'stockfish'; // 'stockfish' | 'builtin'
let engineThinking = false;
let playerColor = 'white'; // 'white' | 'black'
let gameActive = false;

function setStatus(text, thinking) {
  const s = $('status');
  s.textContent = text;
  s.classList.toggle('thinking', !!thinking);
}

function renderMoves() {
  const h = game.history();
  let out = '';
  for (let i = 0; i < h.length; i += 2) {
    out += (i / 2 + 1) + '. ' + h[i] + (h[i + 1] ? ' ' + h[i + 1] : '') + '  ';
  }
  $('moves').textContent = out;
}

function updateStatus() {
  if (!gameActive) return;
  if (game.game_over()) {
    gameActive = false;
    clearSelection();
    if (game.in_checkmate()) {
      const winnerWhite = game.turn() === 'b';
      const youWon = (winnerWhite && playerColor === 'white') || (!winnerWhite && playerColor === 'black');
      setStatus(youWon ? 'Checkmate — you win!' : 'Checkmate — computer wins.');
    } else if (game.in_stalemate()) {
      setStatus('Stalemate — draw.');
    } else if (game.insufficient_material()) {
      setStatus('Draw — insufficient material.');
    } else if (game.in_threefold_repetition()) {
      setStatus('Draw — threefold repetition.');
    } else {
      setStatus('Draw.');
    }
    return;
  }
  const turn = game.turn();
  const yourTurn = (turn === 'w' && playerColor === 'white') || (turn === 'b' && playerColor === 'black');
  let text = yourTurn ? 'Your move' : 'Computer thinking…';
  if (game.in_check()) text += ' — check!';
  setStatus(text, !yourTurn);
}

function engineMove() {
  if (!gameActive || engineThinking || game.game_over()) return;
  const turn = game.turn();
  const yourTurn = (turn === 'w' && playerColor === 'white') || (turn === 'b' && playerColor === 'black');
  if (yourTurn) return;
  if (engineMode === 'builtin') {
    engineThinking = true;
    updateStatus();
    window.setTimeout(function () { builtinMove(); engineThinking = false; }, 150);
    return;
  }
  if (!engineReady) return;
  const diff = DIFFS[$('difficulty').value];
  engineThinking = true;
  engine.postMessage('setoption name Skill Level value ' + diff.skill);
  engine.postMessage('position fen ' + game.fen());
  engine.postMessage('go depth ' + diff.depth);
}

function onEngineMessage(e) {
  if (engineMode !== 'stockfish') return;
  const msg = typeof e.data === 'string' ? e.data : '';
  if (msg === 'uciok') { engineReady = true; updateStatus(); engineMove(); return; }
  if (msg.indexOf('bestmove') === 0) {
    engineThinking = false;
    const parts = msg.split(' ');
    const mv = parts[1];
    if (!mv || mv === '(none)') { updateStatus(); return; }
    const move = game.move({ from: mv.slice(0, 2), to: mv.slice(2, 4), promotion: 'q' });
    if (move) board.position(game.fen());
    renderMoves();
    updateStatus();
  }
}

const PIECE_VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };

// Piece-square tables, White's perspective, first row = rank 8.
// Black pieces use the vertically mirrored index.
const PST = {
  p: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
  n: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
  b: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
  r: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
  q: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
  k: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]
};

function evaluateBoard() {
  let score = 0;
  const rows = game.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = rows[r][c];
      if (!sq) continue;
      const idx = sq.color === 'w' ? r * 8 + c : (7 - r) * 8 + c;
      const v = PIECE_VAL[sq.type] + PST[sq.type][idx];
      score += sq.color === 'w' ? v : -v;
    }
  }
  return game.turn() === 'w' ? score : -score;
}

function orderMoves(moves) {
  return moves.sort(function (a, b) {
    return (b.captured ? PIECE_VAL[b.captured] : 0) - (a.captured ? PIECE_VAL[a.captured] : 0);
  });
}

function negamax(depth, alpha, beta, ply) {
  if (game.game_over()) {
    if (game.in_checkmate()) return -100000 + ply;
    return 0;
  }
  if (depth === 0) return evaluateBoard();
  let best = -Infinity;
  const moves = orderMoves(game.moves({ verbose: true }));
  for (let i = 0; i < moves.length; i++) {
    game.move(moves[i]);
    const sc = -negamax(depth - 1, -beta, -alpha, ply + 1);
    game.undo();
    if (sc > best) best = sc;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

function builtinMove() {
  const diff = $('difficulty').value;
  const depth = diff === 'hard' ? 3 : 2;
  const moves = orderMoves(game.moves({ verbose: true }));
  if (moves.length === 0) { updateStatus(); return; }
  if (diff === 'easy' && Math.random() < 0.35) {
    game.move(moves[Math.floor(Math.random() * moves.length)]);
  } else {
    let best = -Infinity;
    let bestMove = moves[0];
    for (let i = 0; i < moves.length; i++) {
      game.move(moves[i]);
      const sc = -negamax(depth - 1, -Infinity, Infinity, 1);
      game.undo();
      if (sc > best) { best = sc; bestMove = moves[i]; }
    }
    game.move(bestMove);
  }
  board.position(game.fen());
  renderMoves();
  updateStatus();
}

function useBuiltinEngine(note) {
  if (engineMode === 'builtin') return;
  engineMode = 'builtin';
  engineReady = false;
  if (engine) { try { engine.terminate(); } catch (err) {} engine = null; }
  $('engineNote').textContent = note;
  updateStatus();
  engineMove();
}

function startEngine() {
  engineMode = 'stockfish';
  try {
    engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');
  } catch (err) {
    useBuiltinEngine('Playing with the built-in brain — this browser blocked the Stockfish download.');
    return;
  }
  engine.onmessage = onEngineMessage;
  engine.onerror = function () {
    useBuiltinEngine('Playing with the built-in brain — Stockfish failed to start here.');
  };
  engine.postMessage('uci');
  window.setTimeout(function () {
    if (engineMode === 'stockfish' && !engineReady) {
      useBuiltinEngine('Playing with the built-in brain — Stockfish took too long to load here.');
    }
  }, 10000);
}

function newGame() {
  const choice = $('color').value;
  playerColor = choice === 'random' ? (Math.random() < 0.5 ? 'white' : 'black') : choice;
  game.reset();
  clearSelection();
  board.orientation(playerColor);
  board.start();
  gameActive = true;
  engineThinking = false;
  renderMoves();
  if (engineReady || engineMode === 'builtin') { updateStatus(); engineMove(); }
  else setStatus('Loading engine…');
}

let selectedSquare = null;

function squareEl(sq) {
  return $('#board [data-square="' + sq + '"]');
}

function clearSelection() {
  selectedSquare = null;
  $('#board .square-55d63').removeClass('selected-square');
  $('#board .move-dot').remove();
}

function selectSquare(sq) {
  clearSelection();
  selectedSquare = sq;
  squareEl(sq).addClass('selected-square');
  game.moves({ square: sq, verbose: true }).forEach(function (m) {
    squareEl(m.to).append('<span class="move-dot"></span>');
  });
}

function squareFromEl(el) {
  const $el = $(el).closest('[data-square]');
  if ($el.length) return $el.attr('data-square');
  const cls = ($(el).attr('class') || '') + ' ' + ($(el).closest('.square-55d63').attr('class') || '');
  const m = cls.match(/square-([a-h][1-8])/);
  return m ? m[1] : null;
}

function onSquareTap(sq) {
  if (!gameActive || engineThinking || game.game_over()) return;
  if (engineMode === 'stockfish' && !engineReady) return;
  const turn = game.turn();
  const yourTurn = (turn === 'w' && playerColor === 'white') || (turn === 'b' && playerColor === 'black');
  if (!yourTurn) return;
  const piece = game.get(sq);
  const myColor = playerColor === 'white' ? 'w' : 'b';
  if (selectedSquare) {
    if (sq === selectedSquare) { clearSelection(); return; }
    if (piece && piece.color === myColor) { selectSquare(sq); return; }
    const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
    clearSelection();
    if (move === null) return;
    board.position(game.fen());
    renderMoves();
    updateStatus();
    window.setTimeout(engineMove, 150);
    return;
  }
  if (piece && piece.color === myColor) selectSquare(sq);
}

board = Chessboard('board', {
  draggable: false,
  position: 'start',
  pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
});

$('#board').on('click', '.square-55d63', function () {
  const sq = squareFromEl(this);
  if (sq) onSquareTap(sq);
});

$('newBtn').onclick = newGame;
$('flipBtn').onclick = function () { board.flip(); };
$('resignBtn').onclick = function () {
  if (!gameActive || game.game_over()) return;
  gameActive = false;
  engineThinking = false;
  clearSelection();
  setStatus('You resigned — computer wins.');
};
$('difficulty').onchange = newGame;
$('color').onchange = newGame;

startEngine();
newGame();
</script>
</body>
</html>
